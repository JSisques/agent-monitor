name: publish

# Publishing is decoupled from versioning: release-please cuts the GitHub
# release, and this workflow ships that tag to npm via trusted publishing (OIDC).
# Only the plugin is published; @agent-radar/core is private and bundled into it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Publish opencode-agent-radar
        working-directory: packages/opencode-plugin
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/tarballs"
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP/tarballs" | tail -n 1)
          npm publish "$tarball" --access public
